name: Preview Environment

on:
  workflow_call:
    inputs:
      container-port:
        type: number
        default: 3000
      readiness-path:
        type: string
        default: /healthz
    secrets:
      VPS_DEPLOY_KEY:
        required: true

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Deploy preview namespace
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          APP_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
          PORT: ${{ inputs.container-port }}
          READINESS_PATH: ${{ inputs.readiness-path }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          NAMESPACE="preview-${APP_NAME}-pr-${PR_NUMBER}"
          APP_SLUG="${APP_NAME#santa-ana-}"
          PREVIEW_HOST="pr-${PR_NUMBER}-${APP_SLUG}.apsantaana.eu"
          IMAGE="ghcr.io/apartamentossantaana/${APP_NAME}:sha-${SHA_SHORT}"

          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k

          # Write manifest to local tempfile to avoid heredoc quoting issues
          cat > /tmp/preview-manifest.yaml << MANIFEST
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${NAMESPACE}
            labels:
              app.kubernetes.io/managed-by: preview-ci
              preview/app: ${APP_NAME}
              preview/pr: "${PR_NUMBER}"
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: preview-tls
            namespace: ${NAMESPACE}
          spec:
            secretName: preview-tls
            dnsNames:
            - ${PREVIEW_HOST}
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${APP_NAME}
            template:
              metadata:
                labels:
                  app: ${APP_NAME}
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: app
                  image: ${IMAGE}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: ${PORT}
                  env:
                  - name: APP_URL
                    value: "https://${PREVIEW_HOST}"
                  - name: APP_NAME
                    value: "${APP_NAME}"
                  - name: NODE_ENV
                    value: production
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
                  readinessProbe:
                    httpGet:
                      path: ${READINESS_PATH}
                      port: ${PORT}
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: ${APP_NAME}
            ports:
            - port: 80
              targetPort: ${PORT}
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-security-headers@kubernetescrd,kube-system-ratelimit@kubernetescrd
          spec:
            tls:
            - hosts:
              - ${PREVIEW_HOST}
              secretName: preview-tls
            rules:
            - host: ${PREVIEW_HOST}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: ${APP_NAME}
                      port:
                        number: 80
          MANIFEST

          # SCP manifest to VPS and apply
          scp -i ~/.ssh/k -o StrictHostKeyChecking=no /tmp/preview-manifest.yaml \
            deploy@217.154.182.252:/tmp/preview-${NAMESPACE}.yaml

          ssh -i ~/.ssh/k -o StrictHostKeyChecking=no deploy@217.154.182.252 \
            "export KUBECONFIG=~/.kube/config
            kubectl apply -f /tmp/preview-${NAMESPACE}.yaml
            # Copy ghcr-secret to preview namespace
            kubectl get secret ghcr-secret -n webs -o json | \
              python3 -c \"
          import json, sys
          d = json.load(sys.stdin)
          d['metadata'] = {'name': 'ghcr-secret', 'namespace': '${NAMESPACE}'}
          print(json.dumps(d))
          \" | kubectl apply -f -
            rm /tmp/preview-${NAMESPACE}.yaml"

          echo "PREVIEW_HOST=${PREVIEW_HOST}" >> \$GITHUB_ENV

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const host = process.env.PREVIEW_HOST;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Preview deployed'));
            const body = `🚀 **Preview deployed:** https://${host}\n\n_Updated on ${new Date().toISOString().slice(0,16)} UTC_`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  cleanup:
    name: Cleanup preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview namespace
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          APP_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          NAMESPACE="preview-${APP_NAME}-pr-${PR_NUMBER}"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=no deploy@217.154.182.252 \
            "export KUBECONFIG=~/.kube/config && \
             kubectl delete namespace ${NAMESPACE} --ignore-not-found && \
             echo 'Namespace ${NAMESPACE} deleted'"
