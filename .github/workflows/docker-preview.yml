name: Preview Environment

on:
  workflow_call:
    inputs:
      container-port:
        type: number
        default: 3000
      readiness-path:
        type: string
        default: /healthz
    secrets:
      VPS_DEPLOY_KEY:
        required: true

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan 217.154.182.252 >> ~/.ssh/known_hosts

      - name: Deploy preview namespace
        env:
          APP_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
          PORT: ${{ inputs.container-port }}
          READINESS_PATH: ${{ inputs.readiness-path }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          NAMESPACE="preview-${APP_NAME}-pr-${PR_NUMBER}"
          APP_SLUG="${APP_NAME#santa-ana-}"
          PREVIEW_HOST="pr-${PR_NUMBER}-${APP_SLUG}.apsantaana.eu"
          IMAGE="ghcr.io/apartamentossantaana/${APP_NAME}:sha-${SHA_SHORT}"

          # Generate manifest via Python to avoid heredoc indentation issues
          python3 - <<PYEOF
          import os, textwrap

          ns        = os.environ["NAMESPACE"] if "NAMESPACE" in os.environ else "${NAMESPACE}"
          host      = "${PREVIEW_HOST}"
          image     = "${IMAGE}"
          app       = "${APP_NAME}"
          port      = "${PORT}"
          probe     = "${READINESS_PATH}"

          manifest = f"""apiVersion: v1
          kind: Namespace
          metadata:
            name: {ns}
            labels:
              app.kubernetes.io/managed-by: preview-ci
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: preview-tls
            namespace: {ns}
          spec:
            secretName: preview-tls
            dnsNames:
            - {host}
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {app}
            namespace: {ns}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {app}
            template:
              metadata:
                labels:
                  app: {app}
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: app
                  image: {image}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: {port}
                  env:
                  - name: APP_URL
                    value: "https://{host}"
                  - name: APP_NAME
                    value: "{app}"
                  - name: NODE_ENV
                    value: production
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
                  readinessProbe:
                    httpGet:
                      path: {probe}
                      port: {port}
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {app}
            namespace: {ns}
          spec:
            selector:
              app: {app}
            ports:
            - port: 80
              targetPort: {port}
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: {app}
            namespace: {ns}
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: kube-system-security-headers@kubernetescrd,kube-system-ratelimit@kubernetescrd
          spec:
            tls:
            - hosts:
              - {host}
              secretName: preview-tls
            rules:
            - host: {host}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: {app}
                      port:
                        number: 80
          """

          # Strip common leading whitespace (artifact of YAML indentation)
          manifest = textwrap.dedent(manifest)
          with open("/tmp/preview-manifest.yaml", "w") as f:
              f.write(manifest)
          print("Manifest written OK")
          PYEOF

          # SCP manifest and apply
          scp /tmp/preview-manifest.yaml deploy@217.154.182.252:/tmp/${NAMESPACE}.yaml
          ssh deploy@217.154.182.252 "
            export KUBECONFIG=~/.kube/config
            kubectl apply -f /tmp/${NAMESPACE}.yaml
            # Copy ghcr-secret to preview namespace
            kubectl get secret ghcr-secret -n webs -o json | \
              python3 -c \"
          import json, sys
          d = json.load(sys.stdin)
          d['metadata'] = {'name': 'ghcr-secret', 'namespace': '${NAMESPACE}'}
          print(json.dumps(d))
          \" | kubectl apply -f -
            rm /tmp/${NAMESPACE}.yaml
            echo Preview namespace ready: ${NAMESPACE}
          "
          echo "PREVIEW_HOST=${PREVIEW_HOST}" >> \$GITHUB_ENV

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const host = process.env.PREVIEW_HOST;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes('Preview deployed'));
            const body = `🚀 **Preview deployed:** https://${host}\n\n_Updated ${new Date().toISOString().slice(0,16)} UTC_`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  cleanup:
    name: Cleanup preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan 217.154.182.252 >> ~/.ssh/known_hosts

      - name: Delete preview namespace
        env:
          APP_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          NAMESPACE="preview-${APP_NAME}-pr-${PR_NUMBER}"
          ssh deploy@217.154.182.252 \
            "export KUBECONFIG=~/.kube/config && \
             kubectl delete namespace ${NAMESPACE} --ignore-not-found && \
             echo Deleted: ${NAMESPACE}"
